name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Localizar solución o proyecto
        id: objetivo
        run: |
          RUTA=$(find . \( -name '*.slnx' -o -name '*.sln' \) | head -n 1)
          if [ -z "$RUTA" ]; then
            RUTA=$(find . -name '*.csproj' | head -n 1)
          fi
          echo "Objetivo encontrado: $RUTA"
          echo "ruta=$RUTA" >> "$GITHUB_OUTPUT"

      - name: Restaurar dependencias
        run: dotnet restore "${{ steps.objetivo.outputs.ruta }}"

      - name: Compilar
        run: dotnet build "${{ steps.objetivo.outputs.ruta }}" --no-restore --configuration Release
